<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Hintergrund-Verlauf -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222224" />
      <stop offset="100%" stop-color="#121213" />
    </linearGradient>

    <!-- Akzent-Verlauf für das Lese-Icon -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E44" />
      <stop offset="100%" stop-color="#F28C28" />
    </linearGradient>

    <!-- Subtler Glanz-Effekt für Tiefe -->
    <linearGradient id="overlay-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Weicher Schatten unter den Formen -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Abgerundete Basis (Squircle / App Icon Form) -->
  <rect x="0" y="0" width="512" height="512" rx="110" fill="url(#bg-grad)" />
  <rect x="0" y="0" width="512" height="512" rx="110" fill="url(#overlay-grad)" />

  <!-- Subtiler Innenrahmen -->
  <rect x="2" y="2" width="508" height="508" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4" />

  <!-- Icon-Gruppe: Aufgeschlagenes Buch / RSVP-Fokus-Symbol -->
  <g filter="url(#drop-shadow)">
    <!-- Linke Buchseite -->
    <path d="M 140 180 C 180 165, 230 175, 256 190 L 256 345 C 230 330, 180 320, 140 335 Z" 
          fill="#F5F5F5" fill-opacity="0.9" />
    
    <!-- Rechte Buchseite -->
    <path d="M 372 180 C 332 165, 282 175, 256 190 L 256 345 C 282 330, 332 320, 372 335 Z" 
          fill="#E0E0E0" fill-opacity="0.9" />

    <!-- Akzent-Lesemarker / RSVP Fokus-Punkt (READ.-Markenzeichen) -->
    <circle cx="256" cy="150" r="22" fill="url(#accent-grad)" />
    
    <!-- Kleines Buchrücken-Detail -->
    <path d="M 256 190 L 256 345" stroke="#181819" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
